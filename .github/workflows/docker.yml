name: Docker build validation
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - tools/docker_build.sh
      - .github/workflows/docker.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build toolchain without APKs, signing keys or publishing
        run: docker build --tag bttv-builder:check .
      - name: Check required SDK tools
        run: |
          docker run --rm --entrypoint bash bttv-builder:check -c '
            set -e
            java -version
            python3 --version
            test -x "$ANDROID_SDK_ROOT/build-tools/30.0.3/zipalign"
            test -f "$ANDROID_SDK_ROOT/platforms/android-30/android.jar"
            # APKEditor 1.4.9 returns 2 for informational commands.
            if apkeditor_version=$(java -jar "$APKEDITOR_PATH" -version 2>&1); then
              apkeditor_status=0
            else
              apkeditor_status=$?
            fi
            if [ "$apkeditor_status" -ne 2 ] || [ "$apkeditor_version" != "APKEditor version 1.4.9, ARSCLib version 1.3.9" ]; then
              echo "APKEditor version validation failed (exit $apkeditor_status)." >&2
              exit 1
            fi
            printf "%s\n" "$apkeditor_version"
          '
